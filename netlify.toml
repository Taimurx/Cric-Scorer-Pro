[build]
  publish = "."

# Global Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

# APK Download Headers
[[headers]]
  for = "/cricket_pro.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=cricket_pro.apk"
    Cache-Control = "public, max-age=86400, must-revalidate"

# WebAssembly Headers
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/web/canvaskit/*"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/web/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Clean URL Redirects
[[redirects]]
  from = "/download"
  to = "/cricket_pro.apk"
  status = 302

[[redirects]]
  from = "/apk"
  to = "/cricket_pro.apk"
  status = 302

[[redirects]]
  from = "/app"
  to = "/web/"
  status = 301

[[redirects]]
  from = "/web"
  to = "/web/"
  status = 301

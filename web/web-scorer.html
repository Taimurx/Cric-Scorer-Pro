<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cric Scorer Pro - Sunlight Keypad</title>
  <link rel="manifest" href="../manifest.json">
  <script src="js/cricket-engine.js"></script>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('cps_theme') || 'sunrise';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) {}
    })();
  </script>
  <script src="js/ThemeManager.js"></script>
  <style>
    :root, [data-theme="sunrise"] {
      --bg: #1F1424;
      --text: #fff;
      --btn-bg: #2E1B33;
      --btn-active: #44244D;
      --primary: #FF3B30;
      --undo: #FF9500;
      --accent: #E0567B;
      --border-color: rgba(224, 86, 123, 0.35);
    }
    [data-theme="ocean"] {
      --bg: #0C192E;
      --text: #fff;
      --btn-bg: #132747;
      --btn-active: #1D3D6F;
      --primary: #FF3B30;
      --undo: #38BDF8;
      --accent: #0284C7;
      --border-color: rgba(56, 189, 248, 0.35);
    }
    [data-theme="midnight"] {
      --bg: #0B0F19;
      --text: #fff;
      --btn-bg: #162033;
      --btn-active: #233454;
      --primary: #FF3B30;
      --undo: #FF9500;
      --accent: #10B981;
      --border-color: rgba(16, 185, 129, 0.35);
    }
    [data-theme="stadium"] {
      --bg: #081C15;
      --text: #fff;
      --btn-bg: #12382B;
      --btn-active: #1A523E;
      --primary: #FF3B30;
      --undo: #F59E0B;
      --accent: #10B981;
      --border-color: rgba(16, 185, 129, 0.35);
    }
    [data-theme="sunlight"] {
      --bg: #000;
      --text: #fff;
      --btn-bg: #222;
      --btn-active: #444;
      --primary: #FF3B30;
      --undo: #FF9500;
      --accent: #F59E0B;
      --border-color: #333;
    }
    [data-theme="royal"] {
      --bg: #120F1F;
      --text: #fff;
      --btn-bg: #241D42;
      --btn-active: #382C66;
      --primary: #FF3B30;
      --undo: #EC4899;
      --accent: #8B5CF6;
      --border-color: rgba(139, 92, 246, 0.35);
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overscroll-behavior-y: contain; /* prevent pull-to-refresh */
      transition: background-color 0.3s ease;
    }
    .header {
      padding: 10px;
      border-bottom: 1px solid var(--border-color, #333);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      flex-wrap: wrap;
    }
    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      margin-top: 5px;
      width: 100%;
      justify-content: space-between;
      padding: 5px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
    }
    .sync-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .scoreboard {
      padding: 15px;
      font-size: 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color, #333);
    }
    .scoreboard .score { font-size: 2.5rem; font-weight: bold; display: inline-block; transition: all 0.3s ease; }
    .details {
      flex: 1;
      padding: 15px;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 15px;
      padding-bottom: max(15px, env(safe-area-inset-bottom));
      background: #111;
    }
    button {
      background: var(--btn-bg);
      color: var(--text);
      border: 2px solid #333;
      border-radius: 8px;
      font-size: 1.8rem;
      font-weight: bold;
      padding: 20px 0;
      touch-action: manipulation; /* disable double-tap zoom */
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.15s ease;
      will-change: transform;
    }
    button:active { 
      background: var(--btn-active); 
      transform: scale(0.92);
    }
    button.wicket { background: var(--primary); border-color: var(--primary); }
    button.undo { background: var(--undo); border-color: var(--undo); color: #000; }
    button.span-2 { grid-column: span 2; }
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #222;
      padding: 20px;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      will-change: transform;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.5);
    }
    .score-anim {
      animation: scorePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes scorePop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); color: var(--accent); }
      100% { transform: scale(1); }
    }
    .bottom-sheet.open { transform: translateY(0); }
    .bottom-sheet button { font-size: 1.2rem; padding: 15px; margin-top: 10px; width: 100%; border:none; }

    /* Theme Dropdown Styles */
    .theme-dropdown-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }
    .theme-picker-toggle {
      background: var(--btn-bg);
      border: 1px solid var(--border-color);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .theme-picker-toggle:hover {
      background: var(--btn-active);
    }
    #theme-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: var(--bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 6px;
      min-width: 165px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      z-index: 9999;
      flex-direction: column;
      gap: 3px;
    }
    .theme-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: background 0.15s ease;
    }
    .theme-menu-item:hover {
      background: var(--btn-active);
    }
    .theme-menu-item.active {
      background: var(--btn-active);
      color: var(--accent);
      outline: 1px solid var(--accent);
    }
  </style>
</head>
<body>

  <div class="header">
    <a href="./" style="text-decoration:none; color:inherit; font-size:0.95rem; display:inline-flex; align-items:center; gap:5px; opacity:0.9;" title="Back to App">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg>
      <span>Back</span>
    </a>
    <span style="font-size:1.05rem;">Taimur XI vs Opponent XI</span>
    <div class="theme-dropdown-wrap">
      <button class="theme-picker-toggle" id="theme-btn" onclick="toggleThemeMenu(event)" title="Choose Theme (6 Themes)">
        <span id="theme-icon">🎨</span>
        <span id="theme-name">Theme</span>
        <span style="font-size:0.7rem; opacity:0.7;">▼</span>
      </button>
      <div id="theme-menu">
        <button class="theme-menu-item" data-theme="sunrise" onclick="selectTheme('sunrise')"><span>🌅</span> Sunrise</button>
        <button class="theme-menu-item" data-theme="ocean" onclick="selectTheme('ocean')"><span>🌊</span> Ocean</button>
        <button class="theme-menu-item" data-theme="midnight" onclick="selectTheme('midnight')"><span>🌙</span> Midnight</button>
        <button class="theme-menu-item" data-theme="stadium" onclick="selectTheme('stadium')"><span>🌿</span> Stadium</button>
        <button class="theme-menu-item" data-theme="sunlight" onclick="selectTheme('sunlight')"><span>☀️</span> Sunlight</button>
        <button class="theme-menu-item" data-theme="royal" onclick="selectTheme('royal')"><span>👑</span> Royal</button>
      </div>
    </div>
    <div class="sync-indicator" id="syncIndicator">
      <span id="syncStatusText">● Online</span>
      <button class="sync-btn" onclick="triggerManualSync()">Sync Now</button>
    </div>
  </div>

  <div class="scoreboard" id="scoreboard">
    <div class="score">0/0 (0.0 ov)</div>
    <div style="color:#aaa; font-size:1rem; margin-top:5px;">CRR: 0.00</div>
  </div>

  <div class="details" id="details">
    <!-- Active info -->
    <div>Striker: *Batsman A (0 off 0)</div>
    <div>Non-Str: Batsman B (0 off 0)</div>
    <div style="margin-top:10px;">Bowler: Bowler X (0.0-0-0-0)</div>
    <div style="margin-top:10px; color:#aaa;" id="thisOver">This Over: </div>
  </div>

  <div class="keypad">
    <button onclick="scoreRun(0)">0</button>
    <button onclick="scoreRun(1)">1</button>
    <button onclick="scoreRun(2)">2</button>
    <button onclick="scoreRun(3)">3</button>
    
    <button onclick="scoreRun(4)">4</button>
    <button onclick="scoreRun(6)">6</button>
    <button onclick="scoreExtra('WIDE')">Wd</button>
    <button onclick="scoreExtra('NO_BALL')">Nb</button>
    
    <button onclick="scoreExtra('LEG_BYE')">Lb</button>
    <button onclick="scoreExtra('BYE')">B</button>
    <button class="wicket" onclick="openWicketSheet()">WICKET</button>
    <button class="undo" onclick="undoLast()">UNDO</button>
    <button class="wicket span-2" onclick="openEditBallModal()" style="background:var(--accent, #0A84FF); border-color:var(--accent, #0A84FF)">EDIT BALL</button>
  </div>

  <div class="bottom-sheet" id="wicketSheet">
    <h3 style="margin-top:0;">Select Dismissal Type</h3>
    <button style="background:var(--primary)" onclick="confirmWicket('BOWLED')">Bowled</button>
    <button style="background:var(--primary)" onclick="confirmWicket('CAUGHT')">Caught</button>
    <button style="background:var(--primary)" onclick="confirmWicket('RUN_OUT')">Run Out</button>
    <button style="background:var(--btn-bg, #555); color:var(--text, #fff)" onclick="closeWicketSheet()">Cancel</button>
  </div>

  <div class="bottom-sheet" id="editSheet">
    <h3 style="margin-top:0;">Edit Specific Ball</h3>
    <div id="editBallList" style="max-height: 200px; overflow-y: auto;"></div>
    <div id="editBallForm" style="display:none;">
      <h4 id="editingLabel"></h4>
      <div>
        <label>Runs: <input type="number" id="editRunsInput" style="font-size:1.5rem; width:50px"></label>
      </div>
      <button style="background:var(--primary, green)" onclick="applyEdit()">Apply Edit</button>
    </div>
    <button style="background:var(--btn-bg, #555); color:var(--text, #fff)" onclick="closeEditBallModal()">Close</button>
  </div>

  <script>
    // Initialize Event-Sourced Engine
    const store = new CricketEngine.IndexedDBEventStore();
    const engine = new CricketEngine.MatchEngine();
    let currentMatchId = 'match_' + Date.now();
    let eventCounter = 1;
    let currentlyEditingEvent = null;
    let currentlyEditingPayload = null;

    // --- PWA & Sync Logic ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }

    const mockApiClient = {
      pushEvents: async (events) => {
        // Simulate network request to backend /api/sync/match-events
        if (!navigator.onLine) throw new Error("Offline");
        console.log(`Pushing ${events.length} events to /api/sync/match-events...`);
        // Fake network latency
        await new Promise(r => setTimeout(r, 600));
        return { syncedIds: events.map(e => e.eventId) };
      }
    };

    const syncService = new CricketEngine.EventSyncService(store, mockApiClient);
    syncService.onSyncComplete = (successCount, failCount) => updateSyncUI();

    function updateSyncUI(forceState) {
      const statusText = document.getElementById('syncStatusText');
      if (!statusText) return;

      if (forceState === 'offline' || !navigator.onLine) {
        statusText.innerHTML = '● Offline - Local Save';
        statusText.style.color = '#ff4d4d';
        return;
      }
      
      if (syncService.syncInProgress) {
        statusText.innerHTML = '↻ Syncing...';
        statusText.style.color = '#38BDF8';
        return;
      }

      store.getUnsyncedEvents().then(unsynced => {
        if (unsynced.length > 0) {
          statusText.innerHTML = `● Pending Sync (${unsynced.length})`;
          statusText.style.color = '#F59E0B';
        } else {
          statusText.innerHTML = '✓ Synced';
          statusText.style.color = '#10B981';
        }
      });
    }

    window.addEventListener('online', () => {
      updateSyncUI();
      syncService.syncOfflineEvents();
    });
    window.addEventListener('offline', () => updateSyncUI('offline'));

    function triggerManualSync() {
      if (navigator.onLine) {
        updateSyncUI();
        syncService.syncOfflineEvents();
      } else {
        alert("You are currently offline. Data is saved locally and will sync when connection is restored.");
      }
    }

    // Attempt to recover previous match ID from URL or localStorage
    const savedMatchId = localStorage.getItem('currentScoringMatchId');
    if (savedMatchId) {
      currentMatchId = savedMatchId;
    } else {
      localStorage.setItem('currentScoringMatchId', currentMatchId);
    }

    async function init() {
      await store.init();
      
      const storedEvents = await store.getEventsForMatch(currentMatchId);
      
      if (storedEvents.length === 0) {
        // Bootstrap new match
        await emitEvent({ type: CricketEngine.EventType.MATCH_STARTED });
        await emitEvent({ type: CricketEngine.EventType.INNINGS_STARTED });
      } else {
        storedEvents.forEach(ev => engine.applyEvent(ev));
      }
      
      render();
      updateSyncUI();
      
      // Auto-sync on startup if online
      if (navigator.onLine) syncService.syncOfflineEvents();
      // Periodically sync every 10 seconds just in case
      syncService.startPeriodicSync(10000);
    }

    async function emitEvent(payload) {
      const ev = {
        eventId: 'evt_' + Date.now() + '_' + eventCounter++,
        matchId: currentMatchId,
        timestamp: Date.now(),
        version: engine.events.length + 1,
        actorId: 'scorer_1',
        ...payload
      };
      await store.saveEvent(ev);
      engine.applyEvent(ev);
      render();
      updateSyncUI();
      
      // Attempt background sync immediately after saving
      if (navigator.onLine) syncService.syncOfflineEvents();
    }

    async function scoreRun(runs) {
      CricketEngine.audio.init();
      CricketEngine.announcer.announceRuns(runs);
      const state = engine.projectedState;
      const inn = state.innings[state.currentInnings - 1];
      await emitEvent({
        type: CricketEngine.EventType.BALL_SCORED,
        payload: {
          overNumber: inn.overs, ballNumber: inn.balls + 1,
          strikerId: 'bat_1', nonStrikerId: 'bat_2', bowlerId: 'bwl_1',
          runsOffBat: runs, extras: [], isFreeHit: false
        }
      });
    }

    async function scoreExtra(extraType) {
      const state = engine.projectedState;
      const inn = state.innings[state.currentInnings - 1];
      await emitEvent({
        type: CricketEngine.EventType.BALL_SCORED,
        payload: {
          overNumber: inn.overs, ballNumber: inn.balls + 1,
          strikerId: 'bat_1', nonStrikerId: 'bat_2', bowlerId: 'bwl_1',
          runsOffBat: 0, extras: [{ type: extraType, runs: 1 }], isFreeHit: false
        }
      });
    }

    function openWicketSheet() { document.getElementById('wicketSheet').classList.add('open'); }
    function closeWicketSheet() { document.getElementById('wicketSheet').classList.remove('open'); }

    function openEditBallModal() {
      const hist = engine.ballHistory.reverse();
      const listDiv = document.getElementById('editBallList');
      listDiv.innerHTML = '';
      if(hist.length === 0) {
        listDiv.innerHTML = 'No balls to edit.';
      } else {
        hist.forEach(b => {
          const div = document.createElement('div');
          div.style = "padding: 10px; border-bottom: 1px solid #444; display:flex; justify-content:space-between;";
          div.innerHTML = `<span>Ov ${b.overNumber}, Ball ${b.ballNumber} (Score: ${b.description})</span> <button style="font-size:1rem; padding:5px 10px; width:auto; margin:0">Edit</button>`;
          div.querySelector('button').onclick = () => showEditForm(b);
          listDiv.appendChild(div);
        });
      }
      document.getElementById('editBallForm').style.display = 'none';
      document.getElementById('editSheet').classList.add('open');
    }
    
    function closeEditBallModal() { document.getElementById('editSheet').classList.remove('open'); }

    function showEditForm(ballRec) {
      currentlyEditingEvent = ballRec.eventId;
      currentlyEditingPayload = ballRec.payload;
      document.getElementById('editingLabel').innerText = `Editing Ov ${ballRec.overNumber}, Ball ${ballRec.ballNumber}`;
      document.getElementById('editRunsInput').value = ballRec.payload.runsOffBat;
      document.getElementById('editBallForm').style.display = 'block';
    }

    async function applyEdit() {
      const newRuns = parseInt(document.getElementById('editRunsInput').value);
      const newPayload = { ...currentlyEditingPayload, runsOffBat: newRuns };
      await emitEvent({
        type: CricketEngine.EventType.EDIT_BALL,
        payload: {
          targetEventId: currentlyEditingEvent,
          newPayload: newPayload
        }
      });
      closeEditBallModal();
    }

    async function confirmWicket(dismissalType) {
      closeWicketSheet();
      CricketEngine.announcer.announceWicket(dismissalType);
      const state = engine.projectedState;
      const inn = state.innings[state.currentInnings - 1];
      await emitEvent({
        type: CricketEngine.EventType.BALL_SCORED,
        payload: {
          overNumber: inn.overs, ballNumber: inn.balls + 1,
          strikerId: 'bat_1', nonStrikerId: 'bat_2', bowlerId: 'bwl_1',
          runsOffBat: 0, extras: [], isFreeHit: false,
          dismissal: { type: dismissalType, batsmanOutId: 'bat_1' }
        }
      });
    }

    async function undoLast() {
      // Find the last ball event that HAS NOT been undone
      const balls = engine.events.filter(e => e.type === CricketEngine.EventType.BALL_SCORED);
      
      let lastValidBall = null;
      for (let i = balls.length - 1; i >= 0; i--) {
        const ball = balls[i];
        const isUndone = engine.events.some(e => e.type === CricketEngine.EventType.UNDO_ACTION && e.payload.targetEventId === ball.eventId);
        if (!isUndone) {
          lastValidBall = ball;
          break;
        }
      }
      
      if (lastValidBall) {
        await emitEvent({
          type: CricketEngine.EventType.UNDO_ACTION,
          payload: { targetEventId: lastValidBall.eventId }
        });
      }
    }

    function animateValueChange(el, newVal) {
      if (!el) return;
      const oldVal = el.getAttribute('data-val') || el.innerText || el.textContent;
      if (oldVal === String(newVal)) return;
      el.setAttribute('data-val', newVal);
      
      const height = el.getBoundingClientRect().height || 20;
      const oldWidth = el.getBoundingClientRect().width;
      
      const computedStyle = window.getComputedStyle(el);
      const temp = document.createElement('span');
      temp.style.visibility = 'hidden';
      temp.style.position = 'absolute';
      temp.style.whiteSpace = 'nowrap';
      temp.style.font = computedStyle.font;
      temp.style.fontWeight = computedStyle.fontWeight;
      temp.style.fontSize = computedStyle.fontSize;
      temp.style.letterSpacing = computedStyle.letterSpacing;
      temp.innerText = newVal;
      document.body.appendChild(temp);
      const newWidth = temp.getBoundingClientRect().width;
      document.body.removeChild(temp);

      const strOld = String(oldVal);
      const strNew = String(newVal);

      el.innerHTML = '';
      const mainContainer = document.createElement('span');
      mainContainer.style.display = 'inline-flex';
      mainContainer.style.alignItems = 'center';
      mainContainer.style.whiteSpace = 'pre'; 

      if (strOld.length !== strNew.length) {
        mainContainer.style.overflow = 'hidden';
        mainContainer.style.verticalAlign = 'bottom';
        mainContainer.style.height = height + 'px';
        mainContainer.style.width = oldWidth + 'px';
        mainContainer.style.transition = 'width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';

        const wrapper = document.createElement('span');
        wrapper.style.display = 'inline-flex';
        wrapper.style.flexDirection = 'column';
        wrapper.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
        
        const oSpan = document.createElement('span');
        oSpan.innerText = strOld;
        oSpan.style.height = height + 'px';
        oSpan.style.lineHeight = height + 'px';
        
        const nSpan = document.createElement('span');
        nSpan.innerText = strNew;
        nSpan.style.height = height + 'px';
        nSpan.style.lineHeight = height + 'px';
        
        wrapper.appendChild(oSpan);
        wrapper.appendChild(nSpan);
        mainContainer.appendChild(wrapper);
        el.appendChild(mainContainer);

        requestAnimationFrame(() => {
          mainContainer.style.width = newWidth + 'px';
          wrapper.style.transform = `translateY(-${height}px)`;
        });
      } else {
        for (let i = 0; i < strNew.length; i++) {
          const oldChar = strOld[i];
          const newChar = strNew[i];

          if (oldChar === newChar) {
            const span = document.createElement('span');
            span.innerText = newChar;
            mainContainer.appendChild(span);
          } else {
            const charWrapper = document.createElement('span');
            charWrapper.style.display = 'inline-flex';
            charWrapper.style.flexDirection = 'column';
            charWrapper.style.overflow = 'hidden';
            charWrapper.style.height = height + 'px';
            charWrapper.style.verticalAlign = 'bottom';
            
            const oSpan = document.createElement('span');
            oSpan.innerText = oldChar;
            oSpan.style.height = height + 'px';
            oSpan.style.lineHeight = height + 'px';
            
            const nSpan = document.createElement('span');
            nSpan.innerText = newChar;
            nSpan.style.height = height + 'px';
            nSpan.style.lineHeight = height + 'px';
            
            charWrapper.appendChild(oSpan);
            charWrapper.appendChild(nSpan);
            charWrapper.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            mainContainer.appendChild(charWrapper);
            
            requestAnimationFrame(() => {
              charWrapper.style.transform = `translateY(-${height}px)`;
            });
          }
        }
        el.appendChild(mainContainer);
      }

      setTimeout(() => {
        if (el.getAttribute('data-val') === strNew) {
          el.innerText = strNew;
        }
      }, 450);
    }

    function render() {
      const state = engine.projectedState;
      if (!state || state.innings.length === 0) return;
      
      const currentInning = state.innings[state.currentInnings - 1];
      const runs = currentInning.runs;
      const wickets = currentInning.wickets;
      const overs = currentInning.overs;
      const balls = currentInning.balls;
      const totalBalls = (overs * 6) + balls;
      
      let crr = 0.00;
      if (totalBalls > 0) {
        crr = (runs / (totalBalls / 6)).toFixed(2);
      }

      const scoreDiv = document.querySelector('#scoreboard .score');
      const crrDiv = document.querySelector('#scoreboard div:nth-child(2)');
      
      const newScoreText = `${runs}/${wickets} (${overs}.${balls} ov)`;
      if (scoreDiv) {
        animateValueChange(scoreDiv, newScoreText);
      }
      if (crrDiv) {
        animateValueChange(crrDiv, `CRR: ${crr}`);
      }

      // Draw 'This Over' text by analyzing last N events
      let overStr = '';
      let ballsInOver = 0;
      for (let i = engine.events.length - 1; i >= 0 && ballsInOver < balls; i--) {
        const ev = engine.events[i];
        if (ev.type === CricketEngine.EventType.BALL_SCORED) {
           // Skip if undone
           const undone = engine.events.some(e => e.type === CricketEngine.EventType.UNDO_ACTION && e.payload.targetEventId === ev.eventId);
           if (!undone) {
             let txt = ev.payload.runsOffBat.toString();
             if (ev.payload.dismissal) txt = 'W';
             if (ev.payload.extras.length > 0) {
               txt = ev.payload.extras[0].type === 'WIDE' ? 'Wd' : (ev.payload.extras[0].type === 'NO_BALL' ? 'Nb' : 'E');
             }
             overStr = txt + ' ' + overStr;
             ballsInOver++;
           }
        }
      }
      document.getElementById('thisOver').innerText = 'This Over: ' + overStr;
    }

    // Unified Theme Switcher Handlers
    function toggleThemeMenu(e) {
      if (e) e.stopPropagation();
      var m = document.getElementById('theme-menu');
      if (m) m.style.display = (m.style.display === 'flex' ? 'none' : 'flex');
    }

    function selectTheme(themeId) {
      if (window.CpsThemeManager) {
        window.CpsThemeManager.setTheme(themeId, 'web-scorer');
      }
      updateThemeUi(themeId);
      var m = document.getElementById('theme-menu');
      if (m) m.style.display = 'none';
    }

    function updateThemeUi(themeId) {
      var activeTheme = (window.CpsThemeManager && window.CpsThemeManager.themes)
        ? window.CpsThemeManager.themes.find(function(t) { return t.id === themeId; })
        : null;
      if (activeTheme) {
        var icon = document.getElementById('theme-icon');
        var name = document.getElementById('theme-name');
        if (icon) icon.textContent = activeTheme.icon;
        if (name) name.textContent = activeTheme.nameEn;
      }
      var items = document.querySelectorAll('.theme-menu-item');
      items.forEach(function(el) {
        if (el.getAttribute('data-theme') === themeId) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    document.addEventListener('click', function(e) {
      var m = document.getElementById('theme-menu');
      var btn = document.getElementById('theme-btn');
      if (m && (!btn || !btn.contains(e.target))) {
        m.style.display = 'none';
      }
    });

    window.addEventListener('cps-theme-changed', function(e) {
      if (e.detail && e.detail.theme) {
        updateThemeUi(e.detail.theme);
      }
    });

    // Sync theme UI on startup
    (function syncInitialTheme() {
      var cur = (window.CpsThemeManager && window.CpsThemeManager.getTheme()) || localStorage.getItem('cps_theme') || 'sunrise';
      updateThemeUi(cur);
    })();

    window.onload = init;
  </script>
</body>
